[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "hairguru-ai-engine"
version = "0.1.0"
description = "Python face shape detection and hairstyle recommendation engine for HairGuru."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "mediapipe>=1.3.0",
  "opencv-python>=4.8.0",
  "numpy>=1.26.0"
]

[project.urls]
"Homepage" = "https://github.com/hairguru/hairguru-ai-engine"
